version: '1.0.0'
prompts:
  decision_router:
    version: '1.0.0'
    description: "Routes user message to knowledge base or direct response"
    template: |
      You route messages for an enterprise IT support assistant.
      Use kb for questions about company IT policies, VPN, password reset, MFA, laptop setup,
      software access, security, email, devices, troubleshooting, or technology support.
      Use direct only for greetings, thanks, or casual chat that needs no company knowledge.
      Query: {state['query']}
      Return valid JSON like {{'route':'kb'}}

  kb_grader:
    version: "1.0.0"  
    description: "This is the key step that decides whether we can answer from the private KB or need web fallback."
    template: |
      You are an evidence grader.
      Query: {query},
      Private KB evidence: {context}
      If the private kb evidence can answer the query, return "good".
      Return "weak" if it can not answer the query or is incomplete
      Return response as valid JSON matching the schema.
      Example:
      {{"grade": "good"}}  

  web_grader:
    version: "1.0.0"  
    description: if the web_results is enough to answer the query, return "good", else return "weak".
    template: |
      you are a web result grader
      query:{query}
      web_results: {web_results}

      if the web_results is enough to answer the query, return "good",
      else return "weak".

      Return your response as valid JSON.
      Example:
      {{"grade": "good"}} 


  rewrite_query:   
    version: "1.0.0"  
    description: If both KB and web evidence are weak, we rewrite once and then try the KB again.
    template: |
      rewrite the query for better retrieval and web search.
      Rules:
      - Preserve original intent 
      - Make it specific and search friendly   
      - Do not answer
      - Return only the rewritten query
      
      Original query:
      {query}
      
